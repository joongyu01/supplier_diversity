<!doctype html>

<title>사회적기업 인증 변경 공고</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 24px;color:#182c39;background:#f7fafb}a{color:#075c89}h1{font-size:28px}article{background:white;border:1px solid #d9e3e9;border-radius:10px;padding:20px;margin:16px 0}h2{font-size:19px;margin:0 0 8px}small{color:#50616a}select,input{padding:10px;margin:6px 8px 6px 0;max-width:100%}.warning{padding:14px;background:#fff1d1}#status{font-weight:600}

<a href="./">기업·물품 검색으로</a>
<h1>사회적기업 인증 변경 공고</h1>
<p>고용노동부 관서의 인증취소·반납 관련 공고를 모았습니다. 각 기업의 인증상태를 확정한 목록은 아닙니다. 원문과 첨부파일에서 대상 기업·인증번호·효력 발생일을 확인하세요.</p>
<p id="status" role="status">수집 현황을 불러오는 중입니다.</p>
<p id="freshness" class="warning" hidden></p>
<label>공고 검색 <input id="query" type="search" placeholder="제목 또는 게시 관서"></label>
<label>유형 <select id="kind"><option value="">전체</option><option value="cancellation_notice">인증취소 관련</option><option value="surrender_notice">인증반납 관련</option><option value="prior_notice">청문·사전통지</option><option value="preliminary_enterprise">예비사회적기업</option><option value="other_change">기타 변경</option></select></label>
<p id="count"></p><main id="notices"></main>
<script src="./cancellations.js" defer></script>
</html>
